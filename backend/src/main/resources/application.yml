spring:
  application:
    name: chat-poc-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ycyw_chat}
    username: ${DB_USERNAME:ycyw}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  security:
    cors-origins:
      - ${CORS_ORIGIN:http://localhost:4200}
    jwt-secret: ${JWT_SECRET:YCYW_Chat_POC_SecretKey_VeryLongString_For_HS256_Encryption_Min32}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}

chat:
  retention-months: ${CHAT_RETENTION_MONTHS:12}
