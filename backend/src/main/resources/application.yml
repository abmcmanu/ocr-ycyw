spring:
  application:
    name: chat-poc-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/ycyw_chat
    username: ycyw
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: YCYW_Chat_POC_SecretKey_VeryLongString_For_HS256_Encryption
  expiration: 86400000 # 24h en ms
