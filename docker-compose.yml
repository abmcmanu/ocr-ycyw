version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: poc-postgres
    environment:
      POSTGRES_USER: ycyw
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ycyw_chat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycyw -d ycyw_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend et Frontend seront démarrés localement pour le dév,
  # ou via Docker si buildés.
  # Ils peuvent être ajoutés ici ultérieurement.

volumes:
  postgres_data:
