version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: poc-postgres
    environment:
      POSTGRES_USER: ycyw
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ycyw_chat
    ports:
      - "5433:5432" # Reste accessible sur le port 5433 depuis votre machine hôte
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycyw -d ycyw_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poc-backend
    ports:
      - "8081:8081"
    environment:
      # URL pointant vers le conteneur postgres sur son port interne 5432
      DB_URL: jdbc:postgresql://postgres:5432/ycyw_chat
      DB_USERNAME: ycyw
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
      CORS_ORIGIN: http://localhost:4200 # Autorise le conteneur frontend s'il est accédé via localhost:4200
      JWT_SECRET: YCYW_Chat_POC_SecretKey_VeryLongString_For_HS256_Encryption_Min32
      JWT_EXPIRATION_MS: 86400000
      RATE_LIMIT_PER_MINUTE: 120
      CHAT_RETENTION_MONTHS: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poc-frontend
    ports:
      - "4200:80" # On mappe le port 80 du Nginx interne sur le port 4200 de votre machine
    depends_on:
      - backend

volumes:
  postgres_data: